# FN-CODE-TUNE - real-code tuning screen from local LiveCodeBench v5 inputs.
#
# CODE_ISL is deliberately capped at 32,000 rather than filling 32,768: the
# chat template and 256 output tokens need headroom. The generated JSONL is
# deterministic and its SHA-256 is written to provenance. This is not AIPerf's
# repetitive synthetic `coding` corpus.
CODE_ISL="${CODE_ISL:-2048}"
case "$CODE_ISL" in
  2048|8192|32000) ;;
  *) echo "CODE_ISL must be 2048, 8192, or 32000" >&2; return 64 ;;
esac

ISL="$CODE_ISL"                 # provenance label; actual ISL comes from file
OSL="${CODE_OSL:-1024}"
INPUT_FILE="$BENCH_DIR/data/lcb_code_${CODE_ISL}.jsonl"
CUSTOM_DATASET_TYPE=single_turn
CONCURRENCY="${CONCURRENCY:-1,2}"
REQUEST_COUNT="${REQUEST_COUNT:-16}"
DURATION=0
WARMUP=2
SEED=42
GOODPUT="time_to_first_token:30000 inter_token_latency:100"

# Two admitted requests each receive CODE_ISL + output/template headroom.
MAX_RUNNING_REQUESTS=2
ENGINE_CTX=$(( (CODE_ISL + OSL + 512) * MAX_RUNNING_REQUESTS ))
PREFILL_BUDGET=8192
CUDA_GRAPH_MAX_BS="${CUDA_GRAPH_MAX_BS:-1}"
