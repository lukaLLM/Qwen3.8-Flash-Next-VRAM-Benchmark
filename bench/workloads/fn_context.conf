# FN-CONTEXT - single-stream context ladder to the native 262,144 window.
# Run with bench/context.sh, which sweeps ISL and NOT concurrency.
#
# THIS RUNS FIRST. The operator's call was to establish maximum context before
# the speed table, and the ladder is also the cheapest way to find out which
# engines can even reach the top rung:
#
#   llama.cpp  245,760 measured (FINDINGS.md 3)          -> 262,144 untested
#   SGLang     131,072 validated, 83.69 of 86 GiB cgroup  -> 262,144 untested,
#              and only ~2.3 GiB of headroom to do it in
#   FreeToken  nothing measured                          -> unknown
#
# "Does not fit" is a RESULT here, not a failure. Record the rung each engine
# died on and move on; do not lower the ladder to make an engine look better.
#
# WHY A FIXED ABSOLUTE LADDER rather than 25/50/75/100% of each engine's own
# pool: percentage-of-pool cells collapse to the same absolute points once the
# native window caps them, while pretending to be engine-relative. Allocator
# capacity is also NOT proof a request of that size is admitted and completed -
# that question gets the capability probe at the bottom of this file.

SWEEP_DIM=isl

# The rungs. 2048 anchors against the published llama.cpp ladder; the middle
# rungs are the audit's fast-screen points so the two tables share x-values.
#
# TOP RUNG IS COMPUTED, NOT ASSUMED: 262144 - OSL(256) - TEMPLATE_MARGIN(512)
# = 261376. The Qwen chat template injects a system prompt and wrapper tokens,
# so "window minus OSL" leaves zero room and is guaranteed to 400. context.sh
# records the ACTUAL input token count per rung and flags any cell whose real
# prompt exceeded the window once the template was applied.
ISL_LADDER="2048,8192,16384,32768,65536,131072,261376"

# OSL small and fixed: this workload is about prefill and TTFT, not decode.
OSL=256
CONCURRENCY=1
DURATION=0            # request-count driven; a 262K prefill is far too slow for a window
CONTEXT_REQUESTS=5    # per rung
WARMUP=1
SEED=42

# Interactive SLO, for goodput reporting only. Nothing is gated on it.
GOODPUT="time_to_first_token:1000 inter_token_latency:50"

# --- parity flags, exported into the engine launch -------------------------
# CAUTION (RULES.md 4): PREFILL_BUDGET is ANALOGOUS across these engines, not
# equivalent. SGLang --chunked-prefill-size, llama.cpp --batch-size and
# FreeToken --max-prefill-length do not schedule identically. The compose
# banner must spell the difference out; do not present it as a matched flag.
ENGINE_CTX=262144
PREFILL_BUDGET=8192

# MAX_RUNNING_REQUESTS=1 is a FAIRNESS REQUIREMENT, not an optimisation. On
# SGLang the mamba pool shrinks and KV grows as admission slots fall, so
# reserving slots a single-stream workload never uses actively penalises it.
# It is also the only setting the SGLang arm has been validated at.
MAX_RUNNING_REQUESTS=1
CUDA_GRAPH_MAX_BS=1

# Capability probe: after the ladder, ONE request sized near the engine's own
# reported pool, to prove or refute that it can actually be served. This is a
# per-engine capability finding and is NOT part of the comparison.
CAPABILITY_PROBE=1
CAPABILITY_FRACTION=0.9
TEMPLATE_MARGIN=512

# --- CORPUS-0, MEASURED 2026-09-02 (results/corpus_audit/) ------------------
# PROMPT_CORPUS is pinned to sonnet, and that is a measurement, not a taste.
# Repeated-8gram coverage - the fraction of token positions inside an 8-gram
# already seen earlier in the SAME prompt, which is what a drafter exploits:
#
#            8K       32K      131K     262K     longest repeat
#   sonnet   0.49%    2.14%*   1.15%    1.56%    73 tokens
#   coding  31.77%   38.81%   61.03%   67.20%   457 tokens
#   * mean of 4 draws (0.61 / 5.38 / 1.29 / 1.28) - see the variance note below
#
# aiperf's `coding` corpus is a ~500K-token pool built by filling the same
# structural templates over and over (coding_content.py:684). At 262K a prompt
# eats over half that pool and TWO THIRDS of its positions sit inside a repeat.
# Benchmarking NEXTN or ngram-mod on it would measure the corpus, not the engine.
# aiperf's own default for this loader is `coding`; do not inherit it.
#
# VARIANCE, and why per-run repetition is still recorded: sonnet draws are not
# uniform - one of four draws at 32K hit a repetitive passage and reached 5.38%.
# Because --random-seed and --parameter-sweep-same-seed give every engine the
# SAME prompts, an unlucky draw inflates all arms equally and the cross-engine
# comparison survives it. Only the absolute tok/s for that cell is affected.
PROMPT_CORPUS=sonnet
