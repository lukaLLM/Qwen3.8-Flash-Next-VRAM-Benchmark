# FN-CTXLADDER - prefill and decode versus context, one sampler, three engines.
#
# THE POINT. We now know all three serve 262,144. Capability is answered. What is
# not answered is the SHAPE between 2K and 262K, and the two endpoints we do have
# say the engines diverge wildly in between:
#
#            prefill tok/s     2K      262K
#   SGLang                   6,923 ->  7,387   flat
#   FreeToken                1,514 ->  3,252   IMPROVES with length
#   llama.cpp                1,782 ->  1,012   degrades
#
# A curve that crosses somewhere between 2K and 262K is the single most useful
# artifact for choosing an engine by workload, and nobody can infer where the
# crossover is from two endpoints.
#
# ONE SAMPLER THROUGHOUT. Run with THINKING=off. The old 2K numbers were
# thinking-on (temp 1.0) and the 262K numbers thinking-off (temp 0.7); lower
# temperature raises NEXTN draft acceptance, so mixing them measures the sampler
# rather than the context. Every rung here uses the model card's instruct values.
SWEEP_DIM=isl

# Doubling rungs, so a crossover is bracketed rather than stepped over. Top rung
# is 262144 - OSL(512) - TEMPLATE_MARGIN(512).
ISL_LADDER="2048,8192,32768,65536,131072,261120"

# OSL 2048. Decode is computed from inter-token intervals, so OSL is the sample
# size for it: 128 gave 127 intervals, 2048 gives 2047. The first pass at OSL 512
# produced a decode column that went 151 -> 129 -> 147 -> 115 -> 166 tok/s with
# rising context, which is not a physical trend - it is noise, most likely NEXTN
# acceptance varying with the corpus slice each rung happens to draw.
#
# It also fixes the aggregate metric: at c=1, aggregate = decode x duty cycle,
# duty = decode_time/(TTFT + decode_time). With a short OSL behind a long prefill,
# aggregate mostly measures prefill. 2048 tokens of decode pushes duty toward 1.
OSL=2048
CONCURRENCY=1
DURATION=0
# THREE measured requests per rung. n=1 cannot separate a trend from a draw, and
# the OSL-512 pass proved that in the decode column. Report median and spread;
# a rung whose three values disagree widely is a finding about variance, not a
# point estimate to average away.
CONTEXT_REQUESTS=3
WARMUP=1                # MUST be > 0 - aiperf refuses 0 and context.sh reads that
                        # as a rung failure (context.sh:177, logs.md #32)
SEED=42

GOODPUT="time_to_first_token:600000 inter_token_latency:1000"

ENGINE_CTX=262144
PREFILL_BUDGET=8192
MAX_RUNNING_REQUESTS=1
CUDA_GRAPH_MAX_BS=1

# sonnet is 1.3M tokens, so even the 261K rung draws a contiguous non-repeating
# slice (CORPUS-0: 1.56% repeated-8gram at 262K). `coding` would be 67.2% and
# would feed the drafters repetition.
PROMPT_CORPUS=sonnet

# Capability is already established in results/FULL_CONTEXT.md; skip the probe
# and spend the time on rungs.
CAPABILITY_PROBE=0
TEMPLATE_MARGIN=512
