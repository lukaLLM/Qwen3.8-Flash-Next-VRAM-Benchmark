# FN-FAST - the audit's seven-cell screen, as one concurrency sweep.
# Run with bench/run.sh.
#
# The audit specifies seven cells. Four of them vary ISL at c=1 and belong to
# fn_context.conf, which sweeps exactly that dimension - running them here as
# well would answer the same question twice with two different scripts. What is
# left is the concurrency family, which is what this file is:
#
#   2K / 256 at c = 1, 2, 4, 8
#
# THE HONEST WARNING ABOUT c>1 ON THIS HARDWARE. The SGLang arm is validated
# ONLY at --max-running-requests 1, at a measured 83.69 of 86 GiB cgroup peak.
# Raising admission grows the KV pool and may simply not fit. If SGLang cannot
# serve c=16, that is a CAPACITY FINDING reported as its own result - it must
# never be presented as "SGLang is slow" when it is actually "SGLang is full".
# Check the recorded pool size before interpreting any concurrency cell.

ISL=2048
OSL=256

# LADDER STOPS AT 8, for two independent reasons that happen to agree.
#
# 1. Operator's call (2026-09-03): nobody runs 8+ concurrent agents on a single
#    workstation like this. The single-stream case is the one that matters, and
#    the honest ladder is the range people actually use. c=1 is the headline;
#    2/4/8 show the shape.
#
# 2. c=16 was MISCONFIGURED here and the gate caught it:
#       concurrency_16: 21.0 errored requests
#       concurrency_16: OSL 2.0 != requested 256.0
#    llama.cpp splits context across slots, so ENGINE_CTX 32768 / PARALLEL 16 =
#    2048 tokens per slot, against a workload needing ISL 2048 + OSL 256 = 2304.
#    Every request overran. At c=8 each slot gets 4096 and fits with room.
#
# Per-slot context is therefore a FAIRNESS PARAMETER, not an afterthought: the
# ladder ceiling and ENGINE_CTX have to be chosen together.
# Overridable so an engine can be run on the ladder it can actually serve
# without forking the workload. SGLang tops out at c=2 here - see below.
CONCURRENCY="${CONCURRENCY:-1,2,4,8}"

# Duration-based, not request-count: a fixed request count gives wildly
# different sample sizes per cell (n=5 at c=1 vs n=80 at c=16), while a fixed
# window gives every cell the same measurement time. The audit's per-cell
# request counts are its floor, not its intent.
DURATION=120
WARMUP=3
SEED=42

# Interactive-chat SLO, reported not gated.
GOODPUT="time_to_first_token:1000 inter_token_latency:50"

# --- parity flags ----------------------------------------------------------
# Same caution as fn_context.conf: PREFILL_BUDGET is analogous, not equivalent.
# 32768 / 8 slots = 4096 tokens per slot, comfortably above the 2304 a request
# needs. Do not raise the ladder without raising this in step.
ENGINE_CTX=32768
PREFILL_BUDGET=8192
MAX_RUNNING_REQUESTS="${MAX_RUNNING_REQUESTS:-8}"  # must be >= max(CONCURRENCY) or the sweep queues instead of serving
CUDA_GRAPH_MAX_BS="${CUDA_GRAPH_MAX_BS:-8}"

# --- CORPUS-0, MEASURED 2026-09-02 (results/corpus_audit/) ------------------
# PROMPT_CORPUS is pinned to sonnet, and that is a measurement, not a taste.
# Repeated-8gram coverage - the fraction of token positions inside an 8-gram
# already seen earlier in the SAME prompt, which is what a drafter exploits:
#
#            8K       32K      131K     262K     longest repeat
#   sonnet   0.49%    2.14%*   1.15%    1.56%    73 tokens
#   coding  31.77%   38.81%   61.03%   67.20%   457 tokens
#   * mean of 4 draws (0.61 / 5.38 / 1.29 / 1.28) - see the variance note below
#
# aiperf's `coding` corpus is a ~500K-token pool built by filling the same
# structural templates over and over (coding_content.py:684). At 262K a prompt
# eats over half that pool and TWO THIRDS of its positions sit inside a repeat.
# Benchmarking NEXTN or ngram-mod on it would measure the corpus, not the engine.
# aiperf's own default for this loader is `coding`; do not inherit it.
#
# VARIANCE, and why per-run repetition is still recorded: sonnet draws are not
# uniform - one of four draws at 32K hit a repetitive passage and reached 5.38%.
# Because --random-seed and --parameter-sweep-same-seed give every engine the
# SAME prompts, an unlucky draw inflates all arms equally and the cross-engine
# comparison survives it. Only the absolute tok/s for that cell is affected.
PROMPT_CORPUS=sonnet

# THE TWO c=1 NUMBERS ARE NOT THE SAME NUMBER, and must not be merged.
#
#   fn_fast   c=1 on a server provisioned for 8 slots   <- "serving" single-stream
#   fn_context c=1 on a server provisioned for 1 slot   <- "single-user" single-stream
#
# Admission slots are not free. Reserving 8 changes the memory split before a
# single request arrives - FINDINGS.md 5 and F3a measured SGLang's usable KV
# rising from 74,460 to 299,964 tokens when admission dropped from 128 to 32,
# because the mamba pool shrinks as KV grows. So a server built to serve 8 is
# NOT the best single-user server, and the single-user headline belongs to
# fn_context, which runs MAX_RUNNING_REQUESTS=1.
#
# Report them separately and say which is which. If the fn_fast c=1 figure is
# noticeably below the fn_context c=1 figure, that gap IS the cost of standing
# ready to serve 8 - a real result, not an inconsistency.

# MEASURED CEILING, 2026-09-03 — SGLang with NEXTN cannot exceed c=2 here.
#
# Boot probe, per-request ctx = 32768/slots, mamba = slots x 5:
#   slots=8  mamba=40  FAILED   ValueError: Loaded weights leave no GPU memory
#                               for the KV cache under --mem-fraction-static=0.9
#   slots=4  mamba=20  FAILED   same
#   slots=2  mamba=10  BOOTED   no cap message -> admission really is 2
#
# Chain: 96 GB card -> NVFP4 weights + NEXTN DRAFT weights -> ~12 GB headroom ->
# 5 mamba state slots per request -> the state cache crowds out KV entirely.
# The engine's own error names it: "If using speculative decoding, draft weights
# are now counted."
#
# So run SGLang as:  CONCURRENCY=1,2 MAX_RUNNING_REQUESTS=2 ./bench/run.sh ... sglang fn_fast
# and report the absent cells as a CAPACITY finding, never as missing data.
