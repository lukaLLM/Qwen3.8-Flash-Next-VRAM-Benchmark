# FN-MAXCTX - can this engine actually serve the model's full 262,144 window?
#
# A CAPABILITY probe, not a throughput measurement. Run with bench/context.sh.
#
# Booting is NOT the answer. FINDINGS.md 7 records an 8 GiB tier that LOADED
# cleanly at ctx 32768 and then died with "Connection reset by peer" on the first
# request - so this sends real requests at the top rung and only counts a rung
# that returns tokens.
#
# One rung, deliberately. The full ladder is a separate question (fn_context);
# this asks only "does full context fit and serve".
SWEEP_DIM=isl

# 262144 - OSL(128) - TEMPLATE_MARGIN(512) = 261504. The chat template injects a
# system prompt and wrapper tokens, so "window minus OSL" is guaranteed to 400.
ISL_LADDER="261504"
OSL=128
CONCURRENCY=1
DURATION=0
CONTEXT_REQUESTS=1      # each 261K prefill is minutes; one measured is enough here
# MUST BE > 0. aiperf rejects 0 with "warmup_request_count: Input should be
# greater than 0", the run dies before sending anything, and context.sh records
# it as a rung FAILURE - i.e. a fake capacity finding. context.sh:177 already
# warns about exactly this (logs.md #32) and I set 0 anyway, then read three
# engines' worth of "cannot fit 262144" off it. All three were this.
WARMUP=1
SEED=42

GOODPUT="time_to_first_token:600000 inter_token_latency:1000"

# Single user, full window. Per-request context = ENGINE_CTX / slots = 262144.
ENGINE_CTX=262144
PREFILL_BUDGET=8192
MAX_RUNNING_REQUESTS=1
CUDA_GRAPH_MAX_BS=1

PROMPT_CORPUS=sonnet    # 1.3M tokens, so a 262K prompt never wraps (CORPUS-0)

# After the rung, ask the engine what pool it reports and try ONE request near
# it. Allocator capacity is not proof of admission.
CAPABILITY_PROBE=1
CAPABILITY_FRACTION=0.9
TEMPLATE_MARGIN=512
