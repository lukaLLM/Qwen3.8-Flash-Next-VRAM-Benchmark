# FN-SMOKE - pipeline validation, NOT a measurement.
#
# Nothing has ever run end to end through this harness on this box. Before
# spending GPU hours on fn_fast or the context ladder, prove the whole chain on
# each engine at minimum cost: preflight asserts -> compose env mapping -> aiperf
# with the per-engine flags -> provenance -> runtime state -> post-run gate.
#
# A failure at cell 3 of 4 an hour into a real sweep costs an hour. A failure
# here costs three minutes, and the two failure modes look identical in the log.
#
# Deliberately c=1 and short: both engines are validated at
# --max-running-requests 1, so this asks nothing either arm has not already done.
ISL=2048
OSL=128
CONCURRENCY=1
DURATION=30
WARMUP=1
SEED=42

GOODPUT="time_to_first_token:2000 inter_token_latency:50"

ENGINE_CTX=8192
PREFILL_BUDGET=2048
MAX_RUNNING_REQUESTS=1
CUDA_GRAPH_MAX_BS=1

# Pinned by CORPUS-0: `coding` shows 31.8% repeated-8gram at 8K rising to 67.2%
# at 262K, which would inflate any speculative arm. See results/corpus_audit/.
PROMPT_CORPUS=sonnet
