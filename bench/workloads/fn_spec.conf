# FN-SPEC - speculative decoding acceptance. Run with bench/specdecode.sh.
#
# WHY THIS EXISTS AS A SEPARATE WORKLOAD. The headline table is best-config per
# engine, which means speculation is ON where an engine has it:
#
#   llama.cpp   --spec-type ngram-mod   (n-gram lookup)
#   SGLang      NEXTN 3/1/4             (native MTP head)
#   FreeToken   none - roadmap only, not in the shipped launch path
#
# So engine speed and speculation availability are confounded BY CONSTRUCTION in
# every headline number. That is a deliberate, operator-chosen framing, and the
# honest way to publish it is to carry the acceptance length beside the speed so
# a reader can see what speculation actually contributed. This file measures it.
#
# ACCEPTANCE IS ALSO A CORPUS TRAP. A drafter's hit rate rises with repeated
# text, so a repetitive prompt inflates acceptance and therefore decode rate.
# Gate CORPUS-0 measures repeated-8gram coverage for `sonnet` and `coding` at
# each ISL and picks the corpus; do not run this workload before that lands, and
# record the chosen corpus in provenance.
#
# Auto_Bench.md 3: prove the feature is ACTIVE, not merely configured. An
# acceptance length of exactly 1.0 means the drafter is inert - a flag accepted
# at boot that did nothing. Fail the arm rather than reporting it as "no gain".

ISL=2048
OSL=256
CONCURRENCY=1
DURATION=120
WARMUP=3
SEED=42

# Speculation can LOSE at concurrency: draft tokens compete for the same batch
# the real requests need. Measure c=1 here, and read the crossover off fn_fast.
SPEC_FIXED_K=1

GOODPUT="time_to_first_token:1000 inter_token_latency:50"

ENGINE_CTX=32768
PREFILL_BUDGET=8192
MAX_RUNNING_REQUESTS=1
CUDA_GRAPH_MAX_BS=1

# --- CORPUS-0, MEASURED 2026-09-02 (results/corpus_audit/) ------------------
# PROMPT_CORPUS is pinned to sonnet, and that is a measurement, not a taste.
# Repeated-8gram coverage - the fraction of token positions inside an 8-gram
# already seen earlier in the SAME prompt, which is what a drafter exploits:
#
#            8K       32K      131K     262K     longest repeat
#   sonnet   0.49%    2.14%*   1.15%    1.56%    73 tokens
#   coding  31.77%   38.81%   61.03%   67.20%   457 tokens
#   * mean of 4 draws (0.61 / 5.38 / 1.29 / 1.28) - see the variance note below
#
# aiperf's `coding` corpus is a ~500K-token pool built by filling the same
# structural templates over and over (coding_content.py:684). At 262K a prompt
# eats over half that pool and TWO THIRDS of its positions sit inside a repeat.
# Benchmarking NEXTN or ngram-mod on it would measure the corpus, not the engine.
# aiperf's own default for this loader is `coding`; do not inherit it.
#
# VARIANCE, and why per-run repetition is still recorded: sonnet draws are not
# uniform - one of four draws at 32K hit a repetitive passage and reached 5.38%.
# Because --random-seed and --parameter-sweep-same-seed give every engine the
# SAME prompts, an unlucky draw inflates all arms equally and the cross-engine
# comparison survives it. Only the absolute tok/s for that cell is affected.
PROMPT_CORPUS=sonnet
