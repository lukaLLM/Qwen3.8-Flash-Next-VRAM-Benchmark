# FN-TIER - decode against a VRAM budget, with the MTP draft head on/off/CPU.
#
# WHY A SEPARATE WORKLOAD rather than reusing fn_code_tune. Two reasons, both of
# them bugs waiting to happen:
#
# 1. NAMESPACE. report_data._code_arms() globs `fn_code_tune_llamacpp_*` and
#    selects the NEWEST arm matching a few parity flags. A 24 GiB-capped,
#    RAM-limited tier run carries the same image tag and load mode as the
#    placement study, so it would silently become the newest row in placement()
#    or mtp() and quietly replace a published number with a different
#    hardware-budget experiment. Artifacts land here as `fn_tier_llamacpp_*` and
#    cannot collide.
#
# 2. CONTEXT. fn_code_tune.conf computes ENGINE_CTX as
#    (ISL + OSL + 512) * MAX_RUNNING_REQUESTS using its OWN
#    MAX_RUNNING_REQUESTS=2, and bench_init restores an exported override only
#    AFTER sourcing the conf - so `MAX_RUNNING_REQUESTS=1` would leave a
#    two-slot context sized behind a one-slot run. Here both are set explicitly
#    and neither is computed from the other.
#
# The measurement matches the first report's ladder chart: decode tok/s at a
# 2,048-token prompt, single stream, UBATCH 512, PLE on the CPU. It is NOT
# comparable to results/tier_full/full.csv row-for-row (those came from
# speed_bench_v2.py on different prompts) - the baseline is re-measured here so
# every bar in the new chart comes from one harness.
ISL=2048
OSL="${TIER_OSL:-256}"
INPUT_FILE="$BENCH_DIR/data/lcb_code_2048.jsonl"
CUSTOM_DATASET_TYPE=single_turn

# One request at a time: the chart is a single-stream decode number.
CONCURRENCY=1
MAX_RUNNING_REQUESTS=1
CUDA_GRAPH_MAX_BS=1

# Screening depth by default. The published winners are re-run at
# TIER_REQUESTS=12 in randomised arm order - 4 requests finds a broken or
# clearly slower configuration, it does not establish a difference.
REQUEST_COUNT="${TIER_REQUESTS:-4}"
DURATION=0
WARMUP=1
SEED=42

# Explicit, one slot, with room for the answer and the chat template. At the
# 8 GiB tier the server has to fit this in a very small pool; FINDINGS.md 7
# records that tier loading at 32768 and then dying on the first request.
ENGINE_CTX="${TIER_CTX:-4096}"
PREFILL_BUDGET=2048
UBATCH="${UBATCH:-512}"

GOODPUT="time_to_first_token:600000 inter_token_latency:1000"
