# SGLang WITHOUT speculation — a compose OVERRIDE, not a second engine.
#
#   docker compose -f docker-compose.sglang.yaml -f docker-compose.sglang.nospec.yaml up -d
#
# Compose REPLACES list values rather than merging them, so the whole `command`
# has to be restated. This file is GENERATED from the base compose with the four
# NEXTN flags removed, so it cannot drift from it silently. Regenerate rather
# than hand-edit.
#
# WHY THIS EXISTS. SGLang's decode advantage at c=1 (133.64 vs llama.cpp's 107.90)
# is engine PLUS drafter, and no table can separate them without an arm that has
# the drafter switched off. `--speculative-algorithm` takes a free-form string
# with no "none" value, so it cannot be disabled by env alone.
#
# SECOND EFFECT, and possibly the more interesting one: NEXTN reserves FIVE mamba
# state slots per request. Without it the model needs ONE, so the same state cache
# that capped admission at 2 with speculation should allow ~5x more concurrency
# without it. That makes this override the direct test of "speculation vs
# concurrency compete for the same resource".
services:
  flashnext:
    command:
    - python
    - -m
    - sglang.launch_server
    - --model-path
    - ${SGLANG_MODEL_PATH:-/hf/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/7b719225242aacd3dbd3f9407468c2ee9a9d2594}
    - --served-model-name
    - Qwen3.8-Flash-Next
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --quantization
    - modelopt_fp4
    - --fp4-gemm-backend
    - flashinfer_cudnn
    - --kv-cache-dtype
    - fp8_e4m3
    - --page-size
    - '64'
    - --mamba-radix-cache-strategy
    - extra_buffer
    - --mamba-track-interval
    - '64'
    - --chunked-prefill-size
    - ${SGLANG_CHUNKED_PREFILL_SIZE:-8192}
    - --max-running-requests
    - ${SGLANG_MAX_RUNNING_REQUESTS:-1}
    - --context-length
    - ${SGLANG_CONTEXT_LENGTH:-131072}
    - --max-total-tokens
    - ${SGLANG_MAX_TOTAL_TOKENS:-131072}
    - --max-mamba-cache-size
    - ${SGLANG_MAX_MAMBA_CACHE_SIZE:-5}
    - --mem-fraction-static
    - ${SGLANG_MEM_FRACTION_STATIC:-0.90}
    - --cuda-graph-backend-decode
    - breakable
    - --cuda-graph-max-bs-decode
    - '1'
    - --cuda-graph-backend-prefill
    - disabled
    - --reasoning-parser
    - auto
    - --tool-call-parser
    - auto
    - --enable-metrics
