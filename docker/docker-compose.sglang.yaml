# Qwen3.8-Flash-Next on one RTX PRO 6000 Blackwell (96 GB).
#
# This is the NVMe-streamed PLE deployment, built from
# https://github.com/yepapa-nest/qwen38-flashnext-rtx6000. The 47.68 GiB PLE
# table stays in the original sharded safetensors checkpoint and is gathered
# directly from NVMe with io_uring; it is not copied into host RAM or a sidecar.
#
# Defaults below are the configuration validated on this machine on 2026-09-01.
# Override a value through the matching environment variable only when running
# a new experiment. The model revision is deliberately pinned.
name: sglang_qwen38_flash_next

services:
  flashnext:
    image: ${SGLANG_IMAGE:-sglang-flashnext-sm120:local}
    pull_policy: never
    container_name: ${SGLANG_CONTAINER_NAME:-flashnext}

    gpus: all
    ipc: host
    shm_size: 32gb

    # Docker's default seccomp profile blocks io_uring. This profile is the
    # default plus only io_uring_setup, io_uring_enter and io_uring_register.
    security_opt:
      - seccomp=./sglang/seccomp-io_uring.json

    # Keep an allocator failure inside this container. Equal memory and
    # memory+swap caps also prevent it from spilling into host swap.
    mem_limit: ${SGLANG_MEM_LIMIT:-86g}
    memswap_limit: ${SGLANG_MEM_LIMIT:-86g}

    # SGLang has no authentication layer, so publish only on loopback. Port
    # 8000 remains available to the llama.cpp arm.
    ports:
      - "127.0.0.1:${SGLANG_HOST_PORT:-8001}:8000"

    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      SGLANG_QWEN4_PLE_NVME_PATH: ${SGLANG_MODEL_PATH:-/hf/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/7b719225242aacd3dbd3f9407468c2ee9a9d2594}
      SGLANG_QWEN4_PLE_NVME_BACKEND: io_uring
      SGLANG_QWEN4_PLE_NVME_QUEUE_DEPTH: "${SGLANG_PLE_QUEUE_DEPTH:-512}"
      SGLANG_QWEN4_PLE_NVME_LOG_INTERVAL: "${SGLANG_PLE_LOG_INTERVAL:-1000}"

    volumes:
      # Mount the cache root, not only the snapshot: snapshot files are relative
      # symlinks into ../../blobs and would otherwise be dangling in-container.
      - type: bind
        source: ${HF_HOME:-${HOME}/.cache/huggingface}
        target: /hf
        read_only: true

    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - ${SGLANG_MODEL_PATH:-/hf/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/7b719225242aacd3dbd3f9407468c2ee9a9d2594}
      - --served-model-name
      - Qwen3.8-Flash-Next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - modelopt_fp4
      - --fp4-gemm-backend
      - flashinfer_cudnn
      - --kv-cache-dtype
      - fp8_e4m3
      - --page-size
      - "64"
      - --mamba-radix-cache-strategy
      - extra_buffer
      - --mamba-track-interval
      - "64"
      - --chunked-prefill-size
      - "${SGLANG_CHUNKED_PREFILL_SIZE:-8192}"
      - --max-running-requests
      - "${SGLANG_MAX_RUNNING_REQUESTS:-1}"
      - --context-length
      - "${SGLANG_CONTEXT_LENGTH:-131072}"
      - --max-total-tokens
      - "${SGLANG_MAX_TOTAL_TOKENS:-131072}"
      - --max-mamba-cache-size
      - "${SGLANG_MAX_MAMBA_CACHE_SIZE:-5}"
      # MEASURED 2026-09-03: 0.93 is worth +95,424 KV tokens over 0.90.
      #   0.90 -> pool 166,720 tokens, 87,855 MiB VRAM   (36% short of the window)
      #   0.93 -> pool 262,144 tokens, 89,153 MiB VRAM   (the FULL window)
      #   0.95 -> pool 262,144, identical: now capped by --context-length, not memory
      # +1.3 GB of VRAM buys +57% pool, with NEXTN speculation kept. Boot-only probe;
      # bench/sglang_pool_probe.sh regenerates it.
      - --mem-fraction-static
      - "${SGLANG_MEM_FRACTION_STATIC:-0.93}"
      - --speculative-algorithm
      - NEXTN
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
      - --cuda-graph-backend-decode
      - breakable
      - --cuda-graph-max-bs-decode
      - "${SGLANG_CUDA_GRAPH_MAX_BS_DECODE:-1}"
      - --cuda-graph-backend-prefill
      - disabled
      - --reasoning-parser
      - auto
      - --tool-call-parser
      - auto
      - --enable-metrics

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

    # An OOM or startup error must remain stopped instead of becoming a loop.
    restart: "no"
